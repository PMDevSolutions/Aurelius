name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lightweight structural validation (no Node required) ──────────────
  validate:
    name: Validate Structure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          errors=0
          for f in scripts/*.sh scripts/lib/*.sh .claude/hooks/*.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" || { echo "FAIL: $f"; errors=$((errors + 1)); }
            fi
          done
          echo "Shell syntax check complete, $errors failed"
          exit $errors

      - name: Validate JSON configs
        run: |
          errors=0
          for f in .claude/pipeline.config.json .claude/pipeline.config.schema.json \
                   .claude/settings.json package.json templates/*/*.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null || { echo "FAIL: $f"; errors=$((errors + 1)); }
            fi
          done
          echo "$errors JSON validation failures"
          exit $errors

      - name: Validate pipeline.config.json required sections
        run: |
          python3 -c "
          import json, sys
          with open('.claude/pipeline.config.json') as f:
              config = json.load(f)
          required = ['brandVoice', 'editorialLoop', 'factCheck', 'humanApproval',
                      'assetTypes', 'orchestration']
          missing = [k for k in required if k not in config]
          if missing:
              print(f'Missing required keys: {missing}')
              sys.exit(1)
          approval = config['humanApproval']
          if not (approval.get('required') and approval.get('blocking')):
              print('humanApproval must be required and blocking — the gate is non-negotiable')
              sys.exit(1)
          print('pipeline.config.json structure OK')
          "

      - name: Check doc counts
        run: bash scripts/check-doc-counts.sh

  # ── Node checks: schema validation, unit tests, quality suite ──────────
  test:
    name: Tests & Quality Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pipeline config against schema
        run: node scripts/validate-pipeline-config.js

      - name: Run script tests
        run: pnpm test

      - name: Run quality suite
        run: bash scripts/verify-all.sh --ci
