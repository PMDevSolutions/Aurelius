name: Release

# Two-stage release (see issue #121).
#
# `main` is protected by a ruleset that requires a pull request plus passing
# status checks, and GITHUB_TOKEN has no bypass. A version-bump commit can
# therefore never be pushed to `main` directly from a workflow, so the release
# is split around a pull request:
#
#   workflow_dispatch → prepare: bump package.json + CHANGELOG.md with
#                       commit-and-tag-version (commit only, no tag), push a
#                       `release/vX.Y.Z` branch and open a PR against main.
#   push to main      → publish: when package.json carries a version that has
#                       no `vX.Y.Z` tag yet (i.e. the release PR just merged),
#                       tag the merge commit and create the GitHub Release
#                       from that version's CHANGELOG section.
#                     → installers: then call gui-release.yml (reusable workflow,
#                       same run) to build the desktop GUI installers and attach
#                       them to that Release. Same run on purpose: the Release is
#                       created with GITHUB_TOKEN, and GitHub never fires
#                       `on: release` for an event that token created.
#
# Opening the release PR (issue #144): with a RELEASE_TOKEN repository secret
# (fine-grained PAT with contents + pull requests: write) the PR is opened as
# that user and CI runs on it as normal. Without it the job falls back to
# GITHUB_TOKEN, which has two limits:
#   - It may open a PR only while the repository setting "Allow GitHub Actions
#     to create and approve pull requests" (Settings > Actions > General >
#     Workflow permissions) is on. With it off, GitHub's default, `gh pr create`
#     is refused. The branch is pushed by then, so the step does not fail: it
#     writes the compare link, the PR body and the exact `gh pr create` command
#     to the step summary and ends with a warning.
#   - A PR it did open starts no `pull_request` workflow, so the required
#     checks never run until someone closes and reopens the PR once.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Preview the bump and changelog without pushing anything"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Stage 1: bump + changelog → release PR ─────────────────────────────
  prepare:
    name: Prepare release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and generate changelog
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Call the binary directly. `pnpm release -- --release-as X` forwards
          # the literal `--`, after which commit-and-tag-version treats every
          # flag as a positional argument and silently auto-detects the bump.
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi

          if [ "$RELEASE_TYPE" = "auto" ]; then
            pnpm exec commit-and-tag-version --skip.tag $DRY
          else
            pnpm exec commit-and-tag-version --skip.tag --release-as "$RELEASE_TYPE" $DRY
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — nothing was committed or pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists on origin — this version has already been released."
            exit 1
          fi

      - name: Push release branch
        if: inputs.dry_run != true
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          # Force so re-dispatching for the same version refreshes the branch.
          git push --force origin "$BRANCH"

      - name: Open release PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP:-/tmp}"
          TITLE="chore(release): $TAG"
          {
            echo "Release **$TAG** prepared by the Release workflow (\`$RELEASE_TYPE\` bump)."
            echo
            echo "Merging this PR tags the merge commit as \`$TAG\` and publishes the GitHub Release automatically."
            echo
            echo "## Release notes"
            echo
            cat RELEASE_NOTES.md
          } > "$TMP/release-pr-body.md"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$TMP/release-pr-body.md"
            URL="$EXISTING"
          elif URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$TMP/release-pr-body.md" 2>"$TMP/pr-create.err"); then
            :
          else
            # Refused (issue #144). Without RELEASE_TOKEN this runs as GITHUB_TOKEN, which may
            # open a PR only while "Allow GitHub Actions to create and approve pull requests"
            # is on. The branch is already pushed, so hand over to a human instead of failing.
            ERROR=$(tr -d '\r' < "$TMP/pr-create.err")
            COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1&title=chore%28release%29%3A%20$TAG"
            {
              echo "## Release PR not opened"
              echo
              echo "Branch \`$BRANCH\` is pushed, but \`gh pr create\` failed:"
              echo
              echo '```'
              echo "$ERROR"
              echo '```'
              echo
              case "$ERROR" in
                *"not permitted to create or approve pull requests"*)
                  echo "The step ran with \`GITHUB_TOKEN\` and the repository setting **Allow GitHub Actions to create and approve pull requests** (Settings > Actions > General > Workflow permissions) is off. To let the workflow open the PR itself next time, either add a \`RELEASE_TOKEN\` repository secret (fine-grained PAT with Contents and Pull requests: write; the PR is then opened as that user and CI starts on its own) or turn that setting on (the PR then still needs one close and reopen before CI runs)."
                  echo
                  ;;
              esac
              echo "Open the PR by hand from the [compare view]($COMPARE), pasting the body below, or with the GitHub CLI:"
              echo
              echo '```sh'
              echo "gh pr create --repo $GITHUB_REPOSITORY --base main --head $BRANCH \\"
              echo "  --title \"$TITLE\" --body-file - <<'PR_BODY'"
              cat "$TMP/release-pr-body.md"
              echo "PR_BODY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Could not open the release PR ($(echo "$ERROR" | head -n 1)). Branch $BRANCH is pushed; the step summary has the compare link and a gh pr create command."
            exit 0
          fi
          echo "Release PR: $URL" >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::notice::PR opened with GITHUB_TOKEN, which does not trigger CI. Close and reopen it to run the required checks, or add a RELEASE_TOKEN secret."
          fi

  # ── Stage 2: merged bump on main → tag + GitHub Release ────────────────
  publish:
    name: Tag and publish release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect unreleased version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists — nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG not yet tagged — publishing."
          fi

      - name: Extract release notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/extract-release-notes.js --version "$VERSION"

      - name: Tag the release commit
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "chore(release): $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 3: desktop GUI installers onto the Release ───────────────────
  installers:
    name: Build and attach GUI installers
    needs: publish
    if: needs.publish.outputs.release == 'true'
    uses: ./.github/workflows/gui-release.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
