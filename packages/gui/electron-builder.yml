# Packaging config. Build installers locally with:
#   pnpm --filter @aurelius/gui package      (electron-vite build && electron-builder)
#
# The GUI operates on an Aurelius checkout on disk — it locates the repo markers
# (or you point it at a folder) and runs the repo's scripts there: scaffolding
# new apps next to scripts/, running the Figma pipeline, and writing visual-QA
# artifacts under .claude/visual-qa/. So the app bundle ships only the GUI
# itself; it deliberately does NOT embed the project or its scripts (those live
# in, and must stay writable in, the user's checkout).
appId: net.pmds.aurelius.gui
productName: Aurelius
# electron-builder derives the binary name from the package name ("@aurelius/gui"
# → "@aureliusgui"), which it then rejects as unsafe for paths; name it explicitly.
executableName: aurelius
# One naming scheme for every asset on a GitHub Release (gui-release.yml builds
# macOS for both architectures): Aurelius-2.1.0-mac-arm64.dmg,
# Aurelius-2.1.0-mac-x64.dmg, Aurelius-2.1.0-win-x64.exe and
# Aurelius-2.1.0-linux-x86_64.AppImage (AppImage spells the arch x86_64).
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
asar: true
win:
  target: nsis
  # Unsigned local builds: skip the code-sign + exe-edit step so electron-builder
  # doesn't fetch the winCodeSign toolchain (whose archive holds macOS symlinks that
  # can't be extracted on Windows without Developer Mode / an elevated shell).
  signAndEditExecutable: false
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
